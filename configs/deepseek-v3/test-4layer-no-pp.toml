redis = "12800"

[train]
resume = false
epoch = 1
output_dir = "./outputs/test-4layer-no-pp"
epsilon = 1e-6
optm_name = "AdamW"
optm_lr = 2e-7
optm_impl = "fused"
optm_weight_decay = 0.01
optm_betas = [ 0.9, 0.999,]
optm_warmup_steps = 10
optm_grad_norm_clip = 1.0
async_tp_enabled = false
compile = false
param_dtype = "bfloat16"
fsdp_reduce_dtype = "float32"
fsdp_offload = false
fsdp_reshard_after_forward = "default"
train_batch_per_replica = 8
sync_weight_interval = 1
max_num_steps = 100
deterministic = true
seed = 42

[policy]
model_name_or_path = "/lustre/fsw/portfolios/sw/users/heslami/.cache/deepseek-v3-4layer/dcp_hf"
model_max_length = 512
model_gradient_checkpointing = true

[logging]
logger = ['console']
project_name = "cosmos_rl"
experiment_name = "test-4layer-no-pp-100step"

[train.train_policy]
type = "sft"
dataset.name = "/lustre/fsw/portfolios/sw/users/ssrinivasa/datasets/data"
dataset.subset = ""
dataset.split = "train"
conversation_column_name = "conversation"
mini_batch = 8

[train.ckpt]
enable_checkpoint = false

[policy.parallelism]
n_init_replicas = 1
tp_size = 1
cp_size = 1
ep_size = 4
dp_shard_size = 8
pp_size = 1
dp_replicate_size = 1
cp_rotate_method = "allgather"

[profiler]
enable_profiler = false
